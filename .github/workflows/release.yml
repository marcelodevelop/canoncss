name: Release to npm

# Publishes canoncss to npm when a GitHub Release is published.
# Auth is npm Trusted Publishing (OIDC): no token stored anywhere.
# One-time setup on npmjs.com: package canoncss > Settings >
# Trusted Publisher > GitHub Actions > repo marcelodevelop/canonframework,
# workflow release.yml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and verify
        run: |
          npm run build
          npm test
      - name: Publish
        run: npm publish --access public --provenance
