name: Release to npm

# Publishes canoncss to npm when a GitHub Release is published.
# Auth is npm Trusted Publishing (OIDC): no token stored anywhere.
# One-time setup on npmjs.com: package canoncss > Settings >
# Trusted Publisher > GitHub Actions > repo marcelodevelop/canoncss,
# workflow release.yml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+. Node 22 still bundles npm 10.9.x,
      # which never attempts the OIDC exchange: it publishes unauthenticated and
      # the registry answers 404 rather than admitting the package exists.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest && npm --version
      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and verify
        run: |
          npm run build
          npm test
      # No --provenance: trusted publishing attaches provenance by default.
      - name: Publish
        run: npm publish --access public
