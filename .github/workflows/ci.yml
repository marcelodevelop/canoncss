name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canon.css + AGENTS.md
        run: npm run build
      - name: Lint 20-page LLM regression corpus + fixture
        run: npm test
      - name: Fail if build output drifted from committed dist
        run: git diff --exit-code dist/ prompts/AGENTS.md

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
